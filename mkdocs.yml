site_name: FastAPI Validation Override
site_description: Replace FastAPI's 422 validation error with the status code, body and content type you choose, at runtime and in the OpenAPI schema.
site_url: https://fastapi-validation-override.matblack81.com/
repo_url: https://github.com/matblack81/fastapi-validation-override
repo_name: matblack81/fastapi-validation-override
copyright: Copyright &copy; 2026 Matteo Nieddu &middot; <a href="https://github.com/matblack81/fastapi-validation-override/blob/main/LICENSE">MIT License</a>
edit_uri: edit/main/docs/

theme:
  name: material
  variant: classic
  logo: assets/images/logo-header.svg
  favicon: assets/images/favicon.svg
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.annotate
    - content.code.copy
    - content.footnote.tooltips
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/matblack81/fastapi-validation-override
      name: Source code on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fastapi-validation-override/
      name: fastapi-validation-override on PyPI
    - icon: fontawesome/solid/bug
      link: https://github.com/matblack81/fastapi-validation-override/issues
      name: Report an issue

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Guide:
      - Quick start: quickstart.md
      - Options:
          - options/index.md
          - Error builder: options/error-builder.md
          - Media type: options/media-type.md
          - Merge target response: options/merge-target-response.md
          - Custom 422 response: options/custom-422-response.md
          - Handle exceptions: options/handle-exceptions.md
          - Custom app.openapi: options/custom-openapi.md
          - Patch 422 responses: options/patch-422-responses.md
          - Webhooks and callbacks: options/webhooks-and-callbacks.md
          - Reverse proxy and sub-apps: options/reverse-proxy-and-sub-apps.md
  - Release notes: release-notes.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            extensions:
              - griffe_typingdoc
            docstring_section_style: spacy
            show_root_heading: true
            show_root_full_path: false
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            unwrap_annotated: true
            merge_init_into_class: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
